<div class="grid">
    <div class="col-12 md:col-3 lg:col-3">
        <label for="startDate"> Start Date</label>
        <input type="datetime-local"
       [(ngModel)]="dateFiltersModel.StartDate"
       class="w-100"
       pInputText
       (ngModelChange)="updateEndDateMax()">
    </div>

    <div class="col-12 md:col-3 lg:col-3">
        <label for="endDate"> End Date</label>
        <input type="datetime-local"
       [(ngModel)]="dateFiltersModel.EndDate"
       [min]="dateFiltersModel.StartDate"
       [max]="maxDate"
       class="w-100"
       pInputText>
    </div>


</div>
