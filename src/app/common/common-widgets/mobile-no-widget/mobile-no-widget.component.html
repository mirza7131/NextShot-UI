<div *ngIf="mobileNoFormGroup" [formGroup]="mobileNoFormGroup" class="grid">
    <div class="col-12 md:col-12 lg:col-12">
        <label for="mobileNo"> Mobile No</label>
        <p-inputMask formControlName="mobileNo" [showClear]="true" mask="9999-9999999" placeholder="xxxx-xxxxxxx" ></p-inputMask>
    </div>
</div>

<div *ngIf="!mobileNoFormGroup" class="grid">
    <div class="col-12 md:col-12 lg:col-12">
        <label for="mobileNo"> Mobile No</label>
        <p-inputMask [(ngModel)]="mobilenoModel.MobileNo" [showClear]="true" mask="9999-9999999" placeholder="xxxx-xxxxxxx" ></p-inputMask>
    </div>
</div>
