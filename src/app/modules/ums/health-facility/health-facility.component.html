<div class="grid">
    <div class="col-12">
        <div class="card px-6 py-6">
            <p-toast></p-toast>
            <!-- <div class="flex justify-content-end pb-3">
            </div> -->
            <p-table #dt [value]="healthFacilities">
                <ng-template pTemplate="caption">
                    <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
                        <h5 class="m-0">Manage HealthFacilities</h5>
                        <span>
                        <button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded" (click)="openNew()" title="Add New"></button>
                        </span>
                    </div>

                    <div class="block mt-3 md:mt-3">
                        <input pInputText type="text" [(ngModel)]="filterModel.SearchString" placeholder="Search..." style="width: 90%;"/>
                        <button  type="submit" pButton pRipple icon="pi pi-search" (click)="onSearch()"  [style]="{'margin-left':'10px'}" styleClass="p-button-sm"></button>
                    </div>

                </ng-template>
                <ng-template pTemplate="header">
                    <tr>
                        <th>SR</th>
                        <th pSortableColumn="Name">Name <p-sortIcon field="Name"></p-sortIcon></th>
                        <th pSortableColumn="Code">Code <p-sortIcon field="Code"></p-sortIcon></th>
                        <th pSortableColumn="IsActive">Active <p-sortIcon field="IsActive"></p-sortIcon></th>
                        <th>Action</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-healthFacility let-rowIndex="rowIndex">
                    <tr>
                        <td style="width:5rem;">
                            <b>{{((filterModel.PageNumber-1)*filterModel.PageSize)+rowIndex+1}}</b>
                        </td>
                        <td style="width:50%; min-width:10rem;">
                            <span class="p-column-title">Name</span>
                            {{healthFacility.Name}}
                        </td>
                        <td style="width:30%; min-width:8rem;">
                            <span class="p-column-title">Code</span>
                            {{healthFacility.Code}}
                        </td>
                        <td style="width:30%; min-width: 10rem;"><span class="p-column-title">Status</span>
                            <p-badge [value]="healthFacility.IsActive ? 'Active' : 'Not Active'" severity="{{healthFacility.IsActive ? 'success' : 'danger'}}" styleClass="mr-2"></p-badge>
                        </td>
                        <td>
                            <div class="flex">
                                <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2" (click)="editHealthFacility(healthFacility)"></button>
                                <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning" (click)="deleteHealthFacility(healthFacility)"></button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="footer">
                    <tr>
                        <td colspan="5">
                            <p-paginator [rows]="10" [showCurrentPageReport]="true" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [totalRecords]="filterModel.TotalRecords || 0" [rowsPerPageOptions]="[10,20,30,50,100]" (onPageChange)="paginate($event)"></p-paginator>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>

        <p-dialog [(visible)]="healthFacilityDialog" [style]="{width: '450px'}" header="Health Facility" position="center" [draggable]="false" [modal]="true" class="p-fluid bgBlue">
            <ng-template pTemplate="content" >

                <form [formGroup]="healthFacilityForm" class="pt-5">

                    <div class="field">
                        <label for="name">Name</label>
                        <span class="p-float-label p-input-icon-right">
                            <input type="text" autocomplete="off" formControlName="Name" id="Name" autocomplete="off" pInputText [ngClass]="{'ng-invalid ng-dirty': (submitted && !healthFacilityFormControl.Name.valid) || (healthFacilityFormControl.Name.touched && !healthFacilityFormControl.Name.dirty)}">
                            <i class="pi pi-check text-green-700" *ngIf="healthFacilityFormControl.Name.valid"></i>
                            <i class="pi pi-times text-red-500" *ngIf="(submitted && !healthFacilityFormControl.Name.valid) || (healthFacilityFormControl.Name.touched && !healthFacilityFormControl.Name.dirty)"></i>
                        </span>
                    </div>

                    <div class="field">
                        <label for="name">Code</label>
                        <span class="p-float-label p-input-icon-right">
                            <input type="text" autocomplete="off" formControlName="Code" id="Code" pInputText [ngClass]="{'ng-invalid ng-dirty': (submitted && !healthFacilityFormControl.Code.valid) || (healthFacilityFormControl.Code.touched && !healthFacilityFormControl.Code.dirty)}">
                            <i class="pi pi-check text-green-700" *ngIf="healthFacilityFormControl.Code.valid"></i>
                            <i class="pi pi-times text-red-500" *ngIf="(submitted && !healthFacilityFormControl.Code.valid) || (healthFacilityFormControl.Code.touched && !healthFacilityFormControl.Code.dirty)"></i>
                        </span>
                    </div>

                    <div class="field">
                        <label for="status" class="mb-3">Active</label><br>
                        <p-inputSwitch  formControlName="IsActive"></p-inputSwitch>
                    </div>

                </form>

            </ng-template>

            <ng-template pTemplate="footer">

                <button pButton pRipple label="Cancel" type="button" class="p-button-danger" (click)="hideDialog()"></button>
                <button pButton pRipple label="Save" type="button" (click)="saveDepartment()"></button>

            </ng-template>
        </p-dialog>

         <!-- Start Dialog Delete Health Facility -->
        <p-dialog [(visible)]="deleteHealthFacilityDialog" header="Confirm" [modal]="true" [style]="{width:'450px'}">
            <div class="flex align-items-center justify-content-center mt-3">
                <i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem"></i>
                <span *ngIf="healthFacility">Are you sure you want to delete <b>{{healthFacility.Name}}</b>?</span>
            </div>
            <ng-template pTemplate="footer">
                <button pButton pRipple icon="pi pi-times" type="button" label="No" class="p-button-danger"  (click)="deleteHealthFacilityDialog = false"></button>
                <button pButton pRipple icon="pi pi-check" type="button"  label="Yes"  (click)="confirmDelete()"></button>

            </ng-template>
        </p-dialog>

        <!-- End Dialog Delete Health Facility -->
    </div>
</div>
