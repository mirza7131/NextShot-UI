<div class="grid">
    <div class="col-12">
        <div class="card px-6 py-6">
            <p-toast></p-toast>
            <!-- <div class="flex justify-content-end pb-3">
            </div> -->

            <!-- Table Component -->
            <p-table #dt>
                <ng-template pTemplate="caption">
                    <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
                        <h5 class="m-0">Search by Name</h5>
                    <span class="block mt-2 md:mt-0 ">
                    <button pButton pRipple type="button" icon="pi pi-plus" class="p-button-rounded" (click)="openNew()" title="Add New"></button>
                    </span>

                    </div>
                    <div class="block mt-3 md:mt-3">
                        <input pInputText type="text" [(ngModel)]="filterModel.SearchString" placeholder="Search..." style="width: 90%;"/>
                        <button  type="submit" pButton pRipple icon="pi pi-search" (click)="onSearch()"  [style]="{'margin-left':'10px'}" styleClass="p-button-sm"></button>
                    </div>
                </ng-template>
                <ng-template pTemplate="header">
                    <tr>

                        <th >SR </th>
                        <th pSortableColumn="Name">Health Facility <p-sortIcon field="Name"></p-sortIcon></th>
                        <th pSortableColumn="ShortName">Name <p-sortIcon field="ShortName"></p-sortIcon></th>
                        <!-- <th pSortableColumn="CreatedByName">Created By <p-sortIcon field="CreatedByName"></p-sortIcon></th> -->
                        <th pSortableColumn="IsActive">CNIC<p-sortIcon field="IsActive"></p-sortIcon></th>
                        <th pSortableColumn="IsActive">Description<p-sortIcon field="IsActive"></p-sortIcon></th>
                        <th pSortableColumn="IsActive">Email<p-sortIcon field="IsActive"></p-sortIcon></th>
                        <th pSortableColumn="IsActive">Role<p-sortIcon field="IsActive"></p-sortIcon></th>
                        <th>Action</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" >
                    <tr>

                        <td style="width:5rem;">
                            <b>1</b>
                        </td>

                        <td style="width:30%; min-width:10rem;">
                            <span class="p-column-title">Health Facility</span>
                            HF
                        </td>

                        <td style="width:30%; min-width:10rem;">
                            <span class="p-column-title">Name</span>
                            Asif
                        </td>
                        <td style="width:30%; min-width:8rem;">
                            <span class="p-column-title">CNIC</span>
                            3520272745925
                        </td>

                        <td style="width:30%; min-width:8rem;">
                            <span class="p-column-title">Description</span>
                            Description Here
                        </td>

                        <td style="width:30%; min-width:8rem;">
                            <span class="p-column-title">Email</span>
                            <!-- abc@gmail.com -->
                        </td>

                        <td style="width:30%; min-width:8rem;">
                            <span class="p-column-title">Role</span>
                            Admin
                        </td>

                        <td>
                            <div class="flex">
                                <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"></button>
                                <button *ngIf="showDeleteListItem" pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-danger"></button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="footer">
                    <tr>
                        <td colspan="5">
                            <p-paginator [rows]="10" [showCurrentPageReport]="true" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [totalRecords]="filterModel.TotalRecords || 0" [rowsPerPageOptions]="[10,20,30,50,100]" (onPageChange)="paginate($event)"></p-paginator>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
            <!-- End Table Component -->
        </div>

        <p-dialog [(visible)]="profileTypeDialog" [style]="{width: '450px'}" header="Profile Type Details" position="center" [draggable]="false" [modal]="true" class="p-fluid bgBlue">

            </ng-template> -->
        </p-dialog>

        <!-- End Dialog Delete Profile Type -->
    </div>
</div>
